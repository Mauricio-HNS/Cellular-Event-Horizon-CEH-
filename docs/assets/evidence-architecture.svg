<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560">
<defs><linearGradient id="bg"><stop stop-color="#0b252e"/><stop offset="1" stop-color="#050d12"/></linearGradient></defs>
<rect width="1400" height="560" fill="url(#bg)"/>
<text x="70" y="62" fill="#e8f5f5" font-family="Arial,sans-serif" font-size="34" font-weight="700">EVIDENCE ARCHITECTURE</text>
<text x="70" y="96" fill="#8da9af" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">A CLAIM MUST SURVIVE PROGRESSIVELY HARDER TESTS</text>
<g font-family="Arial,sans-serif">
<g transform="translate(70 155)">
<rect width="280" height="280" rx="20" fill="#102f39" stroke="#315963"/>
<text x="28" y="48" fill="#67e8e2" font-size="17" font-weight="700">01 · IDENTIFIABILITY</text>
<text x="28" y="92" fill="#e8f5f5" font-size="24" font-weight="700">Synthetic worlds</text>
<text x="28" y="137" fill="#9ab4ba" font-size="16">Known transitions</text><text x="28" y="164" fill="#9ab4ba" font-size="16">Known nulls</text><text x="28" y="191" fill="#9ab4ba" font-size="16">Controlled noise</text>
</g>
<g transform="translate(390 155)">
<rect width="280" height="280" rx="20" fill="#102f39" stroke="#315963"/>
<text x="28" y="48" fill="#67e8e2" font-size="17" font-weight="700">02 · INTEGRITY</text>
<text x="28" y="92" fill="#e8f5f5" font-size="24" font-weight="700">Temporal control</text>
<text x="28" y="137" fill="#9ab4ba" font-size="16">No future leakage</text><text x="28" y="164" fill="#9ab4ba" font-size="16">Time shuffling</text><text x="28" y="191" fill="#9ab4ba" font-size="16">Identity permutation</text>
</g>
<g transform="translate(710 155)">
<rect width="280" height="280" rx="20" fill="#102f39" stroke="#315963"/>
<text x="28" y="48" fill="#d8c27c" font-size="17" font-weight="700">03 · INCREMENTAL VALUE</text>
<text x="28" y="92" fill="#e8f5f5" font-size="24" font-weight="700">Baseline challenge</text>
<text x="28" y="137" fill="#9ab4ba" font-size="16">Snapshot-only model</text><text x="28" y="164" fill="#9ab4ba" font-size="16">Trajectory model</text><text x="28" y="191" fill="#9ab4ba" font-size="16">Effect + uncertainty</text>
</g>
<g transform="translate(1030 155)">
<rect width="280" height="280" rx="20" fill="#142d32" stroke="#d8c27c" stroke-width="2"/>
<text x="28" y="48" fill="#d8c27c" font-size="17" font-weight="700">04 · REPLICATION</text>
<text x="28" y="92" fill="#e8f5f5" font-size="24" font-weight="700">External evidence</text>
<text x="28" y="137" fill="#9ab4ba" font-size="16">Held-out datasets</text><text x="28" y="164" fill="#9ab4ba" font-size="16">Frozen methods</text><text x="28" y="191" fill="#9ab4ba" font-size="16">Independent analysis</text>
</g>
</g>
<path d="M350 295H380M670 295H700M990 295H1020" stroke="#67e8e2" stroke-width="3"/>
<text x="70" y="500" fill="#607e86" font-family="Arial,sans-serif" font-size="16">Conceptual validation architecture — passing one level does not establish the biological hypothesis.</text>
</svg>